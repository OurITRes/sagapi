name: 🐞 Bug report
description: Signaler un bug reproductible (hors sécurité)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! ⚠️ Pour les sujets sécurité, **n'ouvrez pas d'issue** : utilisez le lien "Security vulnerability (private)".
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, commit SHA, ou branche
      placeholder: ex. main@abc1234
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Composant
      options:
        - Frontend
        - Governance-API
        - Connector
        - Infra
        - Docs
        - Autre
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Quel est le comportement attendu ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      description: Donnez des étapes claires et minimales
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traces
      description: Copiez-collez les logs pertinents (⚠️ sans secrets)
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié qu'il ne s'agit pas d'un sujet sécurité (sinon -> Security Advisory)
          required: true
        - label: J'ai retiré toute information sensible (secrets, tokens, données privées)
          required: true
