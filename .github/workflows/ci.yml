# Exemple de workflow CI minimal
name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || true
      - name: Run tests
        run: echo "No tests defined"
